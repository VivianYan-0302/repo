<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧問答 - 高中學習平台</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ===== QA Page ===== */
    .qa-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    @media (max-width: 768px) {
      .qa-layout { grid-template-columns: 1fr; }
      .qa-sidebar { order: 2; }
      .qa-main    { order: 1; }
    }

    /* 側邊欄 */
    .qa-sidebar {}
    .sidebar-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 1.2rem;
    }
    .sidebar-card h3 {
      font-size: 0.95rem;
      color: #1e3a5f;
      margin-bottom: 0.8rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.4rem;
    }
    .subject-filter-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.7rem;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      background: transparent;
      color: #3a4a5e;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .subject-filter-btn:hover  { background: #f0f4f8; }
    .subject-filter-btn.active { background: #e0eeff; color: #1e3a5f; font-weight: 700; }

    .hot-question {
      font-size: 0.83rem;
      color: #2563a8;
      cursor: pointer;
      padding: 0.4rem 0;
      border-bottom: 1px solid #f0f4f8;
      display: block;
      line-height: 1.5;
      transition: color 0.15s;
    }
    .hot-question:hover { color: #1e3a5f; text-decoration: underline; }
    .hot-question:last-child { border-bottom: none; }

    /* 主區 */
    .qa-main {}

    /* 搜尋列 */
    .qa-search-bar {
      background: #fff;
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 1.2rem;
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    #qaInput {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1.5px solid #c0d0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: "Noto Sans TC","Microsoft JhengHei",sans-serif;
      color: #1a2332;
      transition: border-color 0.2s;
    }
    #qaInput:focus { outline: none; border-color: #4a9eff; }

    /* 聊天區 */
    .chat-box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 1.5rem;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .chat-empty {
      text-align: center;
      margin: auto;
      color: #7a8a9e;
    }
    .chat-empty .chat-empty-icon { font-size: 3rem; margin-bottom: 0.8rem; }
    .chat-empty p { font-size: 0.95rem; }

    /* 訊息泡泡 */
    .msg { display: flex; gap: 0.8rem; align-items: flex-start; }
    .msg.user  { flex-direction: row-reverse; }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .msg.bot  .msg-avatar { background: #e0eeff; }
    .msg.user .msg-avatar { background: #dcfce7; }
    .msg-bubble {
      max-width: 82%;
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.75;
      color: #1a2332;
    }
    .msg.bot  .msg-bubble { background: #f0f5ff; border-top-left-radius: 2px; }
    .msg.user .msg-bubble { background: #e8f9ef; border-top-right-radius: 2px; text-align: right; }

    /* 解答卡內部樣式 */
    .ans-subject {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #e0e7ff;
      color: #3730a3;
      margin-bottom: 0.6rem;
    }
    .ans-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 0.6rem;
    }
    .ans-body { font-size: 0.9rem; color: #2a3a4e; line-height: 1.85; }
    .ans-body .en-term {
      font-style: italic;
      color: #2563a8;
      font-weight: 600;
    }
    .ans-example {
      background: #f7f9fc;
      border-left: 3px solid #4a9eff;
      padding: 0.5rem 0.8rem;
      border-radius: 0 6px 6px 0;
      margin-top: 0.7rem;
      font-size: 0.86rem;
      color: #3a4a5e;
      line-height: 1.7;
    }
    .ans-tags {
      display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem;
    }
    .ans-tag {
      padding: 0.15rem 0.55rem;
      border-radius: 99px;
      font-size: 0.75rem;
      background: #f0f4f8;
      color: #5a6a7e;
    }

    /* 打字動畫 */
    .typing-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      background: #4a9eff;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-7px); }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">📚 高中學習平台</div>
    <ul class="nav-links">
      <li><a href="index.html">首頁</a></li>
      <li><a href="subjects.html">科目複習</a></li>
      <li><a href="exam.html">學測考古題</a></li>
      <li><a href="writing.html">作文練習</a></li>
      <li><a href="qa.html" class="active">智慧問答</a></li>
      <li><a href="record.html">學習記錄</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <h1>💬 智慧問答</h1>
    <p>輸入任何課業問題，用中文為你詳細解答</p>
  </div>

  <div class="qa-layout">

    <!-- 左側欄 -->
    <div class="qa-sidebar">

      <div class="sidebar-card">
        <h3>📚 依科目篩選</h3>
        <button class="subject-filter-btn active" onclick="setSubjectFilter('all', this)">🔍 全部科目</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('chinese',    this)">📖 國文</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('english',    this)">🔤 英文</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('math',       this)">➗ 數學</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('physics',    this)">⚛️ 物理</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('chemistry',  this)">🧪 化學</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('biology',    this)">🌿 生物</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('history',    this)">📜 歷史</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('geography',  this)">🗺️ 地理</button>
        <button class="subject-filter-btn" onclick="setSubjectFilter('civics',     this)">⚖️ 公民</button>
      </div>

      <div class="sidebar-card">
        <h3>🔥 熱門問題</h3>
        <span class="hot-question" onclick="askHot('什麼是光合作用？')">什麼是光合作用？</span>
        <span class="hot-question" onclick="askHot('牛頓三大運動定律是什麼？')">牛頓三大運動定律是什麼？</span>
        <span class="hot-question" onclick="askHot('現在完成式怎麼用？')">現在完成式怎麼用？</span>
        <span class="hot-question" onclick="askHot('什麼是微積分？')">什麼是微積分？</span>
        <span class="hot-question" onclick="askHot('台灣何時成為日本殖民地？')">台灣何時成為日本殖民地？</span>
        <span class="hot-question" onclick="askHot('pH值是什麼意思？')">pH值是什麼意思？</span>
        <span class="hot-question" onclick="askHot('DNA是什麼？')">DNA是什麼？</span>
        <span class="hot-question" onclick="askHot('什麼是supply和demand？')">什麼是 supply 和 demand？</span>
      </div>

    </div>

    <!-- 右側主區 -->
    <div class="qa-main">
      <!-- 搜尋列 -->
      <div class="qa-search-bar">
        <input
          type="text"
          id="qaInput"
          placeholder="輸入你的問題，例如：什麼是光合作用？現在完成式怎麼用？"
          onkeydown="if(event.key==='Enter') sendQuestion()"
        />
        <button class="btn btn-primary" onclick="sendQuestion()">送出問題</button>
        <button class="btn btn-outline" onclick="clearChat()" title="清除對話">🗑️</button>
      </div>

      <!-- 對話框 -->
      <div class="chat-box" id="chatBox">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-icon">🤔</div>
          <p>有任何課業問題，都可以問我！<br/>我會用中文幫你詳細解釋。</p>
        </div>
      </div>
    </div>

  </div>

  <footer>
    <p>© 2025 高中線上學習平台｜祝你金榜題名 🎉</p>
  </footer>

  <script src="data/qa_bank.js"></script>
  <script>
    let subjectFilter = 'all';

    function setSubjectFilter(subj, btn) {
      subjectFilter = subj;
      document.querySelectorAll('.subject-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function askHot(q) {
      document.getElementById('qaInput').value = q;
      sendQuestion();
    }

    function sendQuestion() {
      const input = document.getElementById('qaInput');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';

      // 移除空狀態
      document.getElementById('chatEmpty').style.display = 'none';

      // 顯示使用者訊息
      appendMsg('user', q);

      // 顯示打字動畫
      const typingId = appendTyping();

      // 模擬延遲後回答
      setTimeout(() => {
        removeTyping(typingId);
        const ans = findAnswer(q, subjectFilter);
        appendAnswer(ans);
        scrollChat();
      }, 600);

      scrollChat();
    }

    function appendMsg(role, text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `
        <div class="msg-avatar">${role === 'bot' ? '🤖' : '👤'}</div>
        <div class="msg-bubble">${escHtml(text)}</div>
      `;
      box.appendChild(div);
    }

    function appendAnswer(ans) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">
          <div class="ans-subject">${ans.subject}</div>
          <div class="ans-title">${escHtml(ans.title)}</div>
          <div class="ans-body">${ans.body}</div>
          ${ans.example ? `<div class="ans-example">📌 範例：${ans.example}</div>` : ''}
          ${ans.tags && ans.tags.length ? `<div class="ans-tags">${ans.tags.map(t=>`<span class="ans-tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
        </div>
      `;
      box.appendChild(div);
    }

    let typingCounter = 0;
    function appendTyping() {
      const id = 'typing_' + (++typingCounter);
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.id = id;
      div.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>`;
      box.appendChild(div);
      return id;
    }
    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollChat() {
      const box = document.getElementById('chatBox');
      setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function clearChat() {
      const box = document.getElementById('chatBox');
      box.innerHTML = `
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-icon">🤔</div>
          <p>有任何課業問題，都可以問我！<br/>我會用中文幫你詳細解釋。</p>
        </div>`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ===== 查詢邏輯 =====
    function findAnswer(query, filter) {
      const q = query.toLowerCase().replace(/[？?！!。，,、\s]/g, '');
      let pool = QA_BANK;
      if (filter !== 'all') pool = pool.filter(a => a.subjectKey === filter);

      // 關鍵字比對（計算命中分數）
      let best = null, bestScore = 0;
      pool.forEach(item => {
        let score = 0;
        item.keywords.forEach(kw => {
          if (q.includes(kw.toLowerCase().replace(/\s/g,''))) score += 2;
        });
        // 標題比對
        const titleClean = item.title.toLowerCase().replace(/[？?！!。，,、\s]/g,'');
        if (q.includes(titleClean) || titleClean.includes(q)) score += 5;
        if (score > bestScore) { bestScore = score; best = item; }
      });

      if (best && bestScore >= 2) return best;

      // 找不到時回傳提示
      return {
        subject: '😅 找不到答案',
        subjectKey: 'none',
        title: '抱歉，我還不知道這題的答案',
        body: `你問的是「<strong>${escHtml(query)}</strong>」，目前我的題庫還沒有這個問題的詳細解答。<br/><br/>你可以試試：<br/>・換個說法重新問看看<br/>・切換左側的科目篩選<br/>・參考科目複習頁面的練習題`,
        example: null,
        tags: ['未收錄題目']
      };
    }
  </script>
</body>
</html>
