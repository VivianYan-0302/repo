<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧問答 - 高中學習平台</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .qa-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    @media (max-width: 768px) {
      .qa-layout { grid-template-columns: 1fr; }
    }

    .sidebar-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 1.2rem;
    }
    .sidebar-card h3 {
      font-size: 0.95rem;
      color: #1e3a5f;
      margin-bottom: 0.8rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.4rem;
    }
    .subject-filter-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.45rem 0.7rem;
      border: none;
      border-radius: 6px;
      font-size: 0.87rem;
      cursor: pointer;
      background: transparent;
      color: #3a4a5e;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .subject-filter-btn:hover  { background: #f0f4f8; }
    .subject-filter-btn.active { background: #e0eeff; color: #1e3a5f; font-weight: 700; }

    .hot-question {
      font-size: 0.83rem;
      color: #2563a8;
      cursor: pointer;
      padding: 0.4rem 0;
      border-bottom: 1px solid #f0f4f8;
      display: block;
      line-height: 1.5;
      transition: color 0.15s;
    }
    .hot-question:hover { color: #1e3a5f; text-decoration: underline; }
    .hot-question:last-child { border-bottom: none; }

    /* 搜尋列 */
    .qa-search-bar {
      background: #fff;
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 1.2rem;
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    #qaInput {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1.5px solid #c0d0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: "Noto Sans TC","Microsoft JhengHei",sans-serif;
      color: #1a2332;
      transition: border-color 0.2s;
    }
    #qaInput:focus { outline: none; border-color: #4a9eff; }

    /* 對話框 */
    .chat-box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 1.5rem;
      min-height: 400px;
      max-height: 620px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .chat-empty {
      text-align: center;
      margin: auto;
      color: #7a8a9e;
    }
    .chat-empty-icon { font-size: 3rem; margin-bottom: 0.8rem; }

    /* 訊息泡泡 */
    .msg { display: flex; gap: 0.8rem; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .msg.bot  .msg-avatar { background: #e0eeff; }
    .msg.user .msg-avatar { background: #dcfce7; }
    .msg-bubble {
      max-width: 85%;
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.8;
      color: #1a2332;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot  .msg-bubble { background: #f0f5ff; border-top-left-radius: 2px; }
    .msg.user .msg-bubble { background: #e8f9ef; border-top-right-radius: 2px; }

    /* 打字動畫 */
    .typing-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      background: #4a9eff;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-7px); }
    }

    /* 科目標籤徽章 */
    .subject-badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #e0e7ff;
      color: #3730a3;
      margin-bottom: 0.4rem;
    }

    /* AI 標記 */
    .ai-badge {
      display: inline-block;
      font-size: 0.72rem;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 99px;
      padding: 0.1rem 0.5rem;
      font-weight: 600;
      margin-left: 0.4rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">📚 高中學習平台</div>
    <ul class="nav-links">
      <li><a href="index.html">首頁</a></li>
      <li><a href="subjects.html">科目複習</a></li>
      <li><a href="exam.html">學測考古題</a></li>
      <li><a href="writing.html">作文練習</a></li>
      <li><a href="qa.html" class="active">智慧問答</a></li>
      <li><a href="record.html">學習記錄</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <h1>💬 智慧問答 <span class="ai-badge">✨ Gemini AI</span></h1>
    <p>輸入任何課業問題，AI 以繁體中文詳細解答，英文科目的術語附上原文對照</p>
  </div>

  <div class="qa-layout">

    <!-- 左側欄 -->
    <div>
      <div class="sidebar-card">
        <h3>📚 指定科目（可選）</h3>
        <button class="subject-filter-btn active" onclick="setSubject('', this)">🔍 不限科目</button>
        <button class="subject-filter-btn" onclick="setSubject('國文', this)">📖 國文</button>
        <button class="subject-filter-btn" onclick="setSubject('英文', this)">🔤 英文</button>
        <button class="subject-filter-btn" onclick="setSubject('數學', this)">➗ 數學</button>
        <button class="subject-filter-btn" onclick="setSubject('物理', this)">⚛️ 物理</button>
        <button class="subject-filter-btn" onclick="setSubject('化學', this)">🧪 化學</button>
        <button class="subject-filter-btn" onclick="setSubject('生物', this)">🌿 生物</button>
        <button class="subject-filter-btn" onclick="setSubject('歷史', this)">📜 歷史</button>
        <button class="subject-filter-btn" onclick="setSubject('地理', this)">🗺️ 地理</button>
        <button class="subject-filter-btn" onclick="setSubject('公民', this)">⚖️ 公民</button>
      </div>

      <div class="sidebar-card">
        <h3>🔥 熱門問題</h3>
        <span class="hot-question" onclick="askHot('什麼是光合作用？')">什麼是光合作用？</span>
        <span class="hot-question" onclick="askHot('牛頓三大運動定律是什麼？')">牛頓三大運動定律？</span>
        <span class="hot-question" onclick="askHot('現在完成式怎麼用？')">現在完成式怎麼用？</span>
        <span class="hot-question" onclick="askHot('微積分的基本概念是什麼？')">微積分的基本概念？</span>
        <span class="hot-question" onclick="askHot('台灣日治時期發生了哪些事？')">台灣日治時期重點？</span>
        <span class="hot-question" onclick="askHot('pH值是什麼？酸鹼怎麼判斷？')">pH值怎麼判斷？</span>
        <span class="hot-question" onclick="askHot('DNA的雙螺旋結構是什麼？')">DNA雙螺旋是什麼？</span>
        <span class="hot-question" onclick="askHot('假設語氣 if 子句怎麼用？')">假設語氣怎麼用？</span>
      </div>

      <div class="sidebar-card">
        <h3>🗑️ 操作</h3>
        <button class="btn btn-outline" style="width:100%;font-size:0.88rem;" onclick="clearChat()">清除對話記錄</button>
      </div>
    </div>

    <!-- 右側主區 -->
    <div>
      <div class="qa-search-bar">
        <input
          type="text"
          id="qaInput"
          placeholder="輸入課業問題，例如：什麼是慣性？被動語態怎麼用？"
          onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendQuestion(); }"
        />
        <button class="btn btn-primary" id="sendBtn" onclick="sendQuestion()">送出問題</button>
      </div>

      <div class="chat-box" id="chatBox">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-icon">🤖</div>
          <p style="font-size:1rem;">任何課業問題都可以問！<br/>AI 會用<strong>繁體中文</strong>詳細解答。</p>
        </div>
      </div>
    </div>

  </div>

  <footer>
    <p>© 2025 高中線上學習平台｜祝你金榜題名 🎉</p>
  </footer>

  <script>
    // API Key 儲存在瀏覽器 localStorage，不寫在程式碼裡（安全做法）
    function getApiKey() { return localStorage.getItem('gemini_api_key') || ''; }
    function getApiUrl() {
      return 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + getApiKey();
    }

    let selectedSubject = '';
    let isLoading = false;

    // 頁面載入時，若尚未設定 Key 則顯示輸入框
    window.addEventListener('DOMContentLoaded', () => {
      if (!getApiKey()) showKeyPrompt();
    });

    function showKeyPrompt() {
      document.getElementById('chatEmpty').innerHTML = `
        <div class="chat-empty-icon">🔑</div>
        <p style="font-size:1rem;margin-bottom:1rem;">請先輸入你的 <strong>Gemini API Key</strong> 以啟用 AI 問答</p>
        <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;">
          <input id="keyInput" type="password" placeholder="貼上你的 API Key（AIzaSy...）"
            style="padding:0.5rem 0.8rem;border:1.5px solid #c0d0e0;border-radius:8px;font-size:0.9rem;width:280px;" />
          <button class="btn btn-primary" style="font-size:0.9rem;" onclick="saveKey()">確認儲存</button>
        </div>
        <p style="font-size:0.78rem;color:#7a8a9e;margin-top:0.8rem;">Key 只儲存在你的瀏覽器本機，不會上傳至任何伺服器</p>`;
    }

    function saveKey() {
      const k = document.getElementById('keyInput').value.trim();
      if (!k) { alert('請輸入 API Key！'); return; }
      localStorage.setItem('gemini_api_key', k);
      document.getElementById('chatEmpty').innerHTML = `
        <div class="chat-empty-icon">🤖</div>
        <p style="font-size:1rem;">任何課業問題都可以問！<br/>AI 會用<strong>繁體中文</strong>詳細解答。</p>`;
    }

    function setSubject(subj, btn) {
      selectedSubject = subj;
      document.querySelectorAll('.subject-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function askHot(q) {
      document.getElementById('qaInput').value = q;
      sendQuestion();
    }

    async function sendQuestion() {
      if (isLoading) return;
      if (!getApiKey()) { showKeyPrompt(); return; }
      const input = document.getElementById('qaInput');
      const q = input.value.trim();
      if (!q) return;

      input.value = '';
      document.getElementById('chatEmpty').style.display = 'none';
      appendUserMsg(q);

      const typingId = appendTyping();
      isLoading = true;
      document.getElementById('sendBtn').disabled = true;

      try {
        const answer = await callGemini(q, selectedSubject);
        removeTyping(typingId);
        appendBotMsg(answer, selectedSubject);
      } catch (err) {
        removeTyping(typingId);
        appendBotMsg('⚠️ 很抱歉，回答時發生錯誤：' + err.message + '\n\n請確認網路連線後再試一次。', '');
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        scrollChat();
      }
    }

    async function callGemini(question, subject) {
      const subjectHint = subject ? `（這是關於高中【${subject}】科目的問題）` : '（這是高中課業問題）';

      const prompt = `你是一位專業的台灣高中補習班老師。請用【繁體中文】回答以下問題${subjectHint}。

回答規則：
1. 全程使用繁體中文說明
2. 如果問題涉及英文科目，英文的專有術語或文法名稱，要同時保留英文原文並加上中文解釋，例如：現在完成式（Present Perfect Tense）
3. 回答要清楚、有條理，適合高中生理解
4. 如有公式或重點，請用條列或分段呈現
5. 結尾可補充一個簡短範例或記憶技巧

學生的問題：${question}`;

      const res = await fetch(getApiUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 1024
          }
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const msg = err?.error?.message || `HTTP ${res.status}`;
        throw new Error(msg);
      }

      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('AI 沒有回傳內容，請再試一次。');
      return text;
    }

    /* ===== UI 輔助函式 ===== */
    function appendUserMsg(text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerHTML = `
        <div class="msg-avatar">👤</div>
        <div class="msg-bubble">${escHtml(text)}</div>`;
      box.appendChild(div);
      scrollChat();
    }

    function appendBotMsg(text, subject) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg bot';
      const badge = subject ? `<div class="subject-badge">${subject}</div><br/>` : '';
      // 將 Markdown 粗體 **text** 轉為 <strong>
      const formatted = escHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
      div.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">${badge}${formatted}</div>`;
      box.appendChild(div);
      scrollChat();
    }

    let typingCount = 0;
    function appendTyping() {
      const id = 'typ_' + (++typingCount);
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.id = id;
      div.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>`;
      box.appendChild(div);
      scrollChat();
      return id;
    }
    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollChat() {
      const box = document.getElementById('chatBox');
      setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function clearChat() {
      const box = document.getElementById('chatBox');
      box.innerHTML = `
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-icon">🤖</div>
          <p style="font-size:1rem;">任何課業問題都可以問！<br/>AI 會用<strong>繁體中文</strong>詳細解答。</p>
        </div>`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
