<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學習記錄 - 高中學習平台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">📚 高中學習平台</div>
    <ul class="nav-links">
      <li><a href="index.html">首頁</a></li>
      <li><a href="subjects.html">科目複習</a></li>
      <li><a href="exam.html">學測考古題</a></li>
      <li><a href="writing.html">作文練習</a></li>
      <li><a href="record.html" class="active">學習記錄</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <h1>📊 學習記錄</h1>
    <p>追蹤每次練習成績，找出弱點，持續進步</p>
  </div>

  <div class="container">

    <!-- 統計摘要 -->
    <div class="record-summary" id="recordSummary">
      <div class="record-stat">
        <div class="stat-num" id="totalSessions">0</div>
        <div class="stat-lbl">總練習次數</div>
      </div>
      <div class="record-stat">
        <div class="stat-num" id="totalQuestions">0</div>
        <div class="stat-lbl">作答題數</div>
      </div>
      <div class="record-stat">
        <div class="stat-num" id="avgScore">0%</div>
        <div class="stat-lbl">平均正確率</div>
      </div>
      <div class="record-stat">
        <div class="stat-num" id="bestScore">-</div>
        <div class="stat-lbl">最高正確率</div>
      </div>
    </div>

    <!-- 操作按鈕 -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:1rem;gap:0.8rem;">
      <button class="btn btn-danger" onclick="clearRecords()" style="font-size:0.85rem;padding:0.4rem 1rem;">清除記錄</button>
    </div>

    <!-- 記錄表格 -->
    <div class="record-table-wrap" id="recordTableWrap">
      <table class="record-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>時間</th>
            <th>科目</th>
            <th>難度</th>
            <th>得分</th>
            <th>正確率</th>
            <th>明細</th>
          </tr>
        </thead>
        <tbody id="recordBody">
        </tbody>
      </table>
    </div>

    <!-- 作答明細 Modal -->
    <div id="detailModal" class="detail-modal" style="display:none;" onclick="closeModal(event)">
      <div class="detail-modal-box">
        <div class="detail-modal-header">
          <span id="detailModalTitle">作答明細</span>
          <button class="detail-modal-close" onclick="closeDetailModal()">✕</button>
        </div>
        <div class="detail-modal-body" id="detailModalBody"></div>
      </div>
    </div>

    <!-- 空狀態 -->
    <div id="emptyState" style="display:none;text-align:center;padding:3rem;color:#5a6a7e;">
      <div style="font-size:3rem;margin-bottom:1rem;">📋</div>
      <p style="font-size:1.1rem;">尚無學習記錄，快去練習吧！</p>
      <a href="subjects.html" class="btn btn-primary" style="margin-top:1.2rem;display:inline-block;">開始練習</a>
    </div>

  </div>

  <footer>
    <p>© 2025 高中線上學習平台｜祝你金榜題名 🎉</p>
  </footer>

  <script>
    const DIFF_MAP = { easy:'基礎', medium:'進階', hard:'挑戰', all:'全部' };

    function loadRecords() {
      const records = JSON.parse(localStorage.getItem('studyRecords') || '[]');
      const tableWrap = document.getElementById('recordTableWrap');
      const emptyState = document.getElementById('emptyState');
      const tbody = document.getElementById('recordBody');

      if (records.length === 0) {
        tableWrap.style.display = 'none';
        emptyState.style.display = 'block';
        document.getElementById('totalSessions').textContent = 0;
        document.getElementById('totalQuestions').textContent = 0;
        document.getElementById('avgScore').textContent = '0%';
        document.getElementById('bestScore').textContent = '-';
        return;
      }

      tableWrap.style.display = 'block';
      emptyState.style.display = 'none';

      // 統計
      const totalSessions   = records.length;
      const totalQuestions  = records.reduce((sum, r) => sum + r.total, 0);
      const avgPct          = Math.round(records.reduce((sum, r) => sum + r.pct, 0) / totalSessions);
      const bestPct         = Math.max(...records.map(r => r.pct));

      document.getElementById('totalSessions').textContent  = totalSessions;
      document.getElementById('totalQuestions').textContent = totalQuestions;
      document.getElementById('avgScore').textContent       = avgPct + '%';
      document.getElementById('bestScore').textContent      = bestPct + '%';

      // 渲染表格
      tbody.innerHTML = records.map((r, idx) => {
        const pctClass = r.pct >= 80 ? 'badge-green' : r.pct >= 60 ? 'badge-yellow' : 'badge-red';
        const diffLabel = DIFF_MAP[r.difficulty] || r.difficulty;
        const hasDetail = r.details && r.details.length > 0;
        return `
          <tr>
            <td>${r.date}</td>
            <td>${r.time || '-'}</td>
            <td>${r.subject}</td>
            <td>${diffLabel}</td>
            <td>${r.score} / ${r.total}</td>
            <td><span class="badge ${pctClass}">${r.pct}%</span></td>
            <td>${hasDetail
              ? `<button class="btn-detail" onclick="openDetailModal(${idx})">查看明細</button>`
              : '<span style="color:#aaa;font-size:0.8rem;">—</span>'}</td>
          </tr>
        `;
      }).join('');
    }

    function openDetailModal(idx) {
      const records = JSON.parse(localStorage.getItem('studyRecords') || '[]');
      const r = records[idx];
      if (!r || !r.details || r.details.length === 0) return;

      document.getElementById('detailModalTitle').textContent =
        `${r.date} ${r.time || ''} ｜ ${r.subject} ｜ ${r.score}/${r.total} (${r.pct}%)`;

      document.getElementById('detailModalBody').innerHTML = r.details.map((d, i) => {
        const optionsHTML = d.options.map((opt, j) => {
          let cls = '';
          if (j === d.answer) cls = 'review-opt-correct';
          if (j === d.chosen && !d.correct) cls = 'review-opt-wrong';
          const mark = j === d.answer ? ' ✅' : (j === d.chosen && !d.correct ? ' ❌' : '');
          return `<div class="review-option ${cls}">${String.fromCharCode(65+j)}. ${opt}${mark}</div>`;
        }).join('');
        return `
          <div class="review-item ${d.correct ? 'review-correct' : 'review-wrong'}">
            <div class="review-item-header">
              <span class="review-num">${d.correct ? '✅' : '❌'} 第 ${i+1} 題</span>
              <span class="review-status">${d.correct ? '答對' : '答錯'}</span>
            </div>
            <div class="review-question">${d.text}</div>
            <div class="review-options">${optionsHTML}</div>
            <div class="review-explanation">💡 解析：${d.explanation}</div>
          </div>`;
      }).join('');

      document.getElementById('detailModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
      document.body.style.overflow = '';
    }

    function closeModal(e) {
      if (e.target === document.getElementById('detailModal')) closeDetailModal();
    }

    function clearRecords() {
      if (confirm('確定要清除所有學習記錄嗎？此操作無法復原。')) {
        localStorage.removeItem('studyRecords');
        loadRecords();
      }
    }

    loadRecords();
  </script>
  <script src="qa-panel.js"></script>
</body>
</html>
