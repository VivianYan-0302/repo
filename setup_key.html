<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><title>設定 API Key - 高中學習平台</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">📚 高中學習平台</div>
</nav>
<div style="max-width:500px;margin:4rem auto;padding:2rem;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center;">
  <div style="font-size:3rem;margin-bottom:1rem;">🔑</div>
  <h2 style="color:#1e3a5f;margin-bottom:0.5rem;">設定 Gemini API Key</h2>
  <p style="color:#5a6a7e;font-size:0.9rem;margin-bottom:1.5rem;">Key 只儲存在你的瀏覽器本機，不會上傳至任何伺服器</p>
  <input id="keyInput" type="password" placeholder="貼上你的 API Key（AIzaSy...）"
    style="width:100%;padding:0.7rem 1rem;border:1.5px solid #c0d0e0;border-radius:8px;font-size:1rem;margin-bottom:1rem;box-sizing:border-box;" />
  <br/>
  <button class="btn btn-primary" style="width:100%;" onclick="saveKey()">✅ 儲存並前往智慧問答</button>
  <p id="msg" style="margin-top:0.8rem;font-size:0.85rem;color:#22c55e;display:none;">已儲存！正在跳轉...</p>
</div>
<script>
  // 若已有 key 直接跳轉
  if (localStorage.getItem('gemini_api_key')) location.href = 'qa.html';

  function saveKey() {
    const k = document.getElementById('keyInput').value.trim();
    if (!k) { alert('請輸入 API Key！'); return; }
    localStorage.setItem('gemini_api_key', k);
    document.getElementById('msg').style.display = 'block';
    setTimeout(() => location.href = 'qa.html', 800);
  }
  document.getElementById('keyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveKey();
  });
</script>
</body>
</html>
